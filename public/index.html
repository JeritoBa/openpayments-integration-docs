<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Open Payments Demo</title>
</head>
<body style="font-family: sans-serif; max-width: 420px; margin: 40px auto">
  <h1>Pago A → B</h1>
  <p>Emisor y receptor están definidos en el archivo <code>.env</code>.</p>

  <form id="form">
    <label>Monto que recibirá B: <input id="amount" value="1.00" /></label>
    <button>Pagar</button>
  </form>
  <p id="msg"></p>

  <script>
    // 1) Pide al backend que prepare el pago.
    // 2) Redirige al emisor a su wallet para que lo apruebe.
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      document.getElementById('msg').textContent = 'Preparando pago...';
      const res = await fetch('/payments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: document.getElementById('amount').value }),
      });
      const data = await res.json();
      if (data.redirectUrl) window.location.href = data.redirectUrl;
      else document.getElementById('msg').textContent = JSON.stringify(data);
    };
  </script>
</body>
</html>
